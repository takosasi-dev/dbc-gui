[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svcscope-gui"
version = "0.1.0"
description = "SvcScope の PC 側。SSH トンネル越しに Linux サーバの状態を見る"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# 今の範囲(トンネルと API クライアント)は標準ライブラリだけで足りる。
dependencies = []

[project.optional-dependencies]
# 画面を足す段で必須になる。それまでは任意。
gui = ["PySide6>=6.6", "pyqtgraph>=0.13"]
dev = ["jsonschema>=4.0"]

[project.scripts]
svcscope-gui = "svcscope_gui.__main__:main"

[project.urls]
Homepage = "https://github.com/takosasi-dev/svcscope-gui"
Agent = "https://github.com/takosasi-dev/svcscope-agent"

[tool.setuptools]
packages = ["svcscope_gui"]
